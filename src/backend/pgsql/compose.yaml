services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '54329:5432'
    environment:
      POSTGRES_DB: hookplane_test
      POSTGRES_USER: hookplane
      POSTGRES_PASSWORD: hookplane
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 15
