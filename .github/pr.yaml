on:
  pull_request:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: actions/setup-node@v4
        with: 
          node-version: 25
          cache: npm 
      - run: pnpm ci
      - run: pnpm run format:check
      - run: pnpm run check-types
      - run: pnpm run lint 
      - run: pnpm run check-types
      - run: pnpm run test
      - run: pnpm run build
